<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Reading Article | Chase Struse</title>
    <meta name="description" content="Technical article reader on Chase Struse's engineering blog." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/index.css" />
    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" />
    <!-- FontAwesome for Icons -->
    <script src="https://kit.fontawesome.com/f28bdc6aab.js" crossorigin="anonymous"></script>
  </head>
  <body>

    <!-- Navigation Header -->
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html#hero" class="nav-logo">
          <span class="nav-logo-mark">CS</span> Chase Struse
        </a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html#about" class="nav-link">About</a></li>
          <li><a href="index.html#projects" class="nav-link">Projects</a></li>
          <li><a href="index.html#tech-stack" class="nav-link">Stack</a></li>
          <li><a href="blog.html" class="nav-link active">Blog</a></li>
          <li><a href="/diagrams/" class="nav-link"><i class="fa-solid fa-diagram-project"></i> Diagrams</a></li>
          <li><a href="index.html#contact" class="nav-link nav-btn">Contact</a></li>
        </ul>
      </div>
    </header>

    <!-- Article Page Content -->
    <article>
      <!-- Article Header Meta -->
      <div class="article-header">
        <div class="container">
          <a href="blog.html" class="article-back-link">
            <i class="fa-solid fa-arrow-left-long"></i> Back to Blog
          </a>
          <h1 class="article-title" id="post-title">Loading Article...</h1>
          <div class="article-meta-row">
            <span class="blog-date" id="post-date">
              <i class="fa-solid fa-calendar-days"></i> --
            </span>
            <span class="blog-date" id="post-read-time">
              <i class="fa-solid fa-clock"></i> -- Min Read
            </span>
          </div>
        </div>
      </div>

      <!-- Article Body Content -->
      <div class="article-container">
        <div class="container">
          <div class="article-content" id="post-content">
            <!-- Dynamic Markdown Content will be rendered here -->
            <div style="text-align: center; padding: 6rem 2rem;">
              <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: var(--accent-primary);"></i>
              <p style="margin-top: 1.5rem; color: var(--text-secondary); font-family: var(--font-sans);">Fetching article content...</p>
            </div>
          </div>
        </div>
      </div>
    </article>

    <!-- Footer -->
    <footer>
      <div class="container footer-content">
        <p class="footer-copyright">
          &copy; 2026 Chase Struse. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Markdown Parser & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- Core and Blog Scripts -->
    <script src="js/main.js"></script>
    <script src="js/blog.js"></script>
  </body>
</html>
